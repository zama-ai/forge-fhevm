# Stand-in for a downstream repo consuming forge-fhevm.
#
# The point of this fixture is the OpenZeppelin pins below: they are deliberately NEWER than
# the versions forge-fhevm builds its vendored host contracts against. Before host bytecode
# was generated, this was impossible — Foundry remappings are project-global, so inheriting
# FhevmTest forced the library's OZ version on the whole consumer project.
#
# `make check-consumer-fixture` populates dependencies/forge-fhevm/ from the repo root,
# mirroring how soldeer would install it.
[profile.default]
src = "src"
test = "test"
solc = "0.8.27"
evm_version = "cancun"
libs = ["dependencies"]

[dependencies]
forge-std = "1.14.0"
"@encrypted-types" = "0.0.4"
"@fhevm-solidity" = "0.11.1"
"@openzeppelin-contracts" = "5.4.0"
"@openzeppelin-contracts-upgradeable" = "5.4.0"

[soldeer]
remappings_generate = false
